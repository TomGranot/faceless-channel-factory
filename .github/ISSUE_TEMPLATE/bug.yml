name: Bug report
description: Report a reproducible defect in the skill, scripts, fixtures, or reference worker.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, account identifiers, publication URLs, cookies, authorization headers, and raw provider responses before submitting.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Portable Agent Skill
        - Channel scaffold or validator
        - Claude Code plugin
        - Comment-to-DM reference worker
        - Documentation
        - Tests or CI
        - Other
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host and version
      description: Name the coding-agent host, Python or Node version, and operating system when relevant.
      placeholder: Codex; Python 3.12; macOS 15
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the smallest sanitized steps or fixture that reproduces the defect.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation output
      description: Paste relevant redacted output from the repository validation commands.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, handles, integration IDs, publication URLs, and private provider data.
          required: true
