name: Setup help
description: Ask a sanitized question about installation, channel design, or a documented contract.
title: "support: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, account identifiers, publication URLs, cookies, authorization headers, analytics exports, and raw provider responses before submitting.
  - type: input
    id: host
    attributes:
      label: Host and version
      description: Name the coding-agent host, operating system, and Python or Node version when relevant.
      placeholder: Codex; Python 3.12; Windows 11
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation
        - Channel contract
        - Source and rights policy
        - Comment-to-DM worker
        - Validation
        - Other
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Include the expected result, observed result, and the smallest sanitized example that explains the issue.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Redacted validation output
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, handles, integration IDs, publication URLs, analytics exports, and private provider data.
          required: true
